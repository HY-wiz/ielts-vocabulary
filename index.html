<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Vocabulary</title><style>body{font:16px system-ui;margin:0;background:#f4f6fb;color:#19283a}main{max-width:750px;margin:auto;padding:20px}section{background:white;border-radius:14px;padding:20px;margin:15px 0}button{background:#1762b4;color:white;border:0;border-radius:8px;padding:12px;margin:5px 4px 5px 0}input{padding:12px;border:1px solid #bbc6d5;border-radius:8px;max-width:95%}.item{border-top:1px solid #ddd;padding:12px 0}small{color:#607080}</style></head><body><main><h1>IELTS Vocabulary</h1><section><h2>最新の語彙候補を取得</h2><p>公開されている学術・ニュースの見出しから、AWLに含まれる語彙候補を抽出します。IELTS試験の出題予測ではありません。</p><button id="fetch">最新候補を取得</button><small id="updated"></small><div id="candidates"></div></section><section><h2>自分の単語を追加</h2><input id="word" placeholder="English word"><input id="meaning" placeholder="日本語の意味"><button id="add">登録</button></section><section><h2>登録済み単語 <span id="count"></span></h2><div id="saved"></div><button id="backup">JSONバックアップ</button><label>JSON読み込み<input type="file" id="restore" accept=".json"></label><p><small>この版は端末内保存です。OneDrive同期は別途Microsoft認証の実装が必要です。</small></p></section></main><script>
const KEY='ielts-words-v2';let words=JSON.parse(localStorage.getItem(KEY)||'[]');const $=x=>document.getElementById(x);function persist(){localStorage.setItem(KEY,JSON.stringify(words));render()}function add(w,m='',source='manual'){w=w.trim().toLowerCase();if(!w||words.some(x=>x.word===w))return false;words.push({word:w,meaning:m,source,createdAt:new Date().toISOString(),due:Date.now()});persist();return true}function render(){const root=$('saved');root.replaceChildren();$('count').textContent=words.length;for(const w of words){const div=document.createElement('div');div.className='item';const strong=document.createElement('strong');strong.textContent=w.word;const inp=document.createElement('input');inp.value=w.meaning||'';inp.placeholder='日本語の意味を入力';inp.onchange=()=>{w.meaning=inp.value;persist()};const del=document.createElement('button');del.textContent='削除';del.onclick=()=>{words=words.filter(x=>x!==w);persist()};div.append(strong,document.createElement('br'),inp,del);root.append(div)}}$('add').onclick=()=>{if(add($('word').value,$('meaning').value)){$('word').value='';$('meaning').value=''}else alert('未入力か登録済みです')};$('fetch').onclick=async()=>{const b=$('fetch');b.disabled=true;b.textContent='取得中…';try{const r=await fetch('./data/latest.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('取得できません');const data=await r.json();$('updated').textContent='最終更新：'+(data.updatedAt||'不明');const root=$('candidates');root.replaceChildren();const fresh=data.candidates.filter(x=>!words.some(w=>w.word===x.word));if(!fresh.length)root.textContent='新しい候補はありません';for(const c of fresh){const div=document.createElement('div');div.className='item';const name=document.createElement('strong');name.textContent=c.word+' ';const desc=document.createElement('small');desc.textContent='掲載数 '+c.count+' / '+c.sources.join('・');const btn=document.createElement('button');btn.textContent='単語帳に追加';btn.onclick=()=>{if(add(c.word,'',c.sources.join(', ')))div.remove()};div.append(name,desc,document.createElement('br'),btn);root.append(div)}}catch(e){alert('取得に失敗しました。GitHub Actionsで最新データが生成されているか確認してください。')}finally{b.disabled=false;b.textContent='最新候補を取得'}};$('backup').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(words,null,2)],{type:'application/json'}));a.href=u;a.download='ielts-words.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};$('restore').onchange=async e=>{try{const v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v))throw Error();for(const w of v)if(typeof w.word==='string')add(w.word,w.meaning||'',w.source||'import');render()}catch{alert('正しいJSONファイルではありません')}};render();
</script></body></html>
