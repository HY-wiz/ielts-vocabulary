<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Vocabulary Cards</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#172d49;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:18px}h1{font-size:1.6rem;margin:12px 0 4px}.sub{color:#62768c;margin:0 0 16px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:18px 0}.tabs button{background:#e0e9f3;color:#26486e}.tabs button.active{background:#185eaa;color:white}button{border:0;background:#185eaa;color:white;border-radius:10px;padding:12px;font-size:15px;cursor:pointer}button:disabled{opacity:.5}section{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #142c4310}.hide{display:none!important}.stats{display:flex;gap:10px}.stats div{flex:1;background:#e7eef8;padding:12px;border-radius:12px;text-align:center}.stats strong{display:block;font-size:1.4rem}.card{min-height:285px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:2px solid #dbe5f1;border-radius:18px;background:linear-gradient(145deg,#fff,#edf4fc);padding:20px;margin:15px 0;cursor:pointer}.card .english{font-size:clamp(2rem,8vw,3rem);font-weight:750;overflow-wrap:anywhere}.card .meaning{font-size:1.5rem;font-weight:650;margin:12px 0}.muted{color:#667b91}.rating{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.rating button:nth-child(1){background:#ba4350}.rating button:nth-child(2){background:#b47a27}.rating button:nth-child(3){background:#28835b}.rating button:nth-child(4){background:#276bb4}input,textarea{font:inherit;width:100%;border:1px solid #b8c9da;border-radius:9px;padding:12px;margin:6px 0 12px}label{font-weight:650}article{padding:12px 0;border-top:1px solid #e2e9f0}article button{margin:5px 5px 0 0}.secondary{background:#e1eaf4;color:#1a4b7d}.danger{background:#ae3b49}.note{font-size:.86rem;color:#667b91;line-height:1.5}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}#notice{font-weight:600;color:#216845}
</style></head><body><main><h1>IELTS Vocabulary</h1><p class="sub">毎日の単語カードと最新語彙の収集</p><div class="stats"><div><strong id="total">0</strong>登録語</div><div><strong id="due">0</strong>復習待ち</div><div><strong id="learned">0</strong>復習済み</div></div><nav class="tabs"><button data-tab="study" class="active">単語カード</button><button data-tab="collect">単語の追加</button><button data-tab="manage">一覧・保存</button></nav>
<section id="study"><h2>今日の復習</h2><p class="muted" id="studyCount"></p><div id="studyBody"></div><p class="note">現時点では簡易的な間隔反復方式です。FSRS・OneDrive自動同期は未実装です。</p></section>
<section id="collect" class="hide"><h2>最新の語彙候補を取得</h2><p class="note">GitHub Actionsが生成した最新データから候補を表示します。IELTSの出題予測ではありません。</p><button id="fetch">最新候補を取得</button><p class="note" id="updated"></p><div id="candidates"></div><h2>自分の単語を追加</h2><label for="word">英単語</label><input id="word" placeholder="English word"><label for="meaning">日本語の意味</label><input id="meaning" placeholder="日本語の意味"><label for="example">例文（任意）</label><textarea id="example" rows="2" placeholder="Example sentence"></textarea><button id="add">登録する</button></section>
<section id="manage" class="hide"><h2>登録済み単語</h2><input id="search" placeholder="単語・意味を検索"><div id="saved"></div><h2>バックアップ</h2><button id="backup">JSONバックアップ</button><label for="restore">JSON読み込み</label><input type="file" id="restore" accept=".json,application/json"><p class="note">この版は端末内保存です。OneDrive同期にはMicrosoft認証の追加実装が必要です。Safariのデータ消去前にバックアップしてください。</p></section></main><script>
'use strict';const KEY='ielts-words-v2';let words=[];try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))words=saved}catch{}const $=id=>document.getElementById(id);let current=null,revealed=false;const now=()=>Date.now();function persist(){localStorage.setItem(KEY,JSON.stringify(words));renderStats()}function renderStats(){const t=now();$('total').textContent=words.length;$('due').textContent=words.filter(w=>!w.due||w.due<=t).length;$('learned').textContent=words.filter(w=>(w.reps||0)>0).length}function showTab(id){for(const tab of ['study','collect','manage'])$(tab).classList.toggle('hide',tab!==id);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));if(id==='study')renderStudy();if(id==='manage')renderList()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));function add(w,m='',source='manual',example=''){w=String(w||'').trim().toLowerCase();if(!w||words.some(x=>x.word===w))return false;words.push({word:w,meaning:m,source,example,createdAt:new Date().toISOString(),due:now(),interval:0,reps:0});persist();return true}
function renderStudy(){renderStats();const due=words.filter(w=>!w.due||w.due<=now()).sort((a,b)=>(a.due||0)-(b.due||0));$('studyCount').textContent='現在の復習対象：'+due.length+'語';const body=$('studyBody');body.replaceChildren();if(!due.length){const p=document.createElement('p');p.textContent=words.length?'本日の復習は完了しました。':'単語を登録すると、ここにカードが表示されます。';body.append(p);return}if(!current||!due.includes(current))current=due[0];revealed=false;const card=document.createElement('div');card.className='card';card.setAttribute('role','button');card.tabIndex=0;const en=document.createElement('div');en.className='english';en.textContent=current.word;const prompt=document.createElement('p');prompt.className='muted';prompt.textContent='タップして意味を表示';card.append(en,prompt);function reveal(){if(revealed)return;revealed=true;prompt.remove();const meaning=document.createElement('div');meaning.className='meaning';meaning.textContent=current.meaning||'意味は未登録です';card.append(meaning);if(current.example){const ex=document.createElement('p');ex.textContent=current.example;card.append(ex)}const rating=document.createElement('div');rating.className='rating';[['忘れた',0],['難しい',1],['思い出せた',2],['簡単',3]].forEach(([label,n])=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>rate(n);rating.append(b)});body.append(rating)}card.onclick=reveal;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reveal()}};body.append(card)}function rate(n){if(!current)return;const w=current;const prev=Number(w.interval)||0;let days;if(n===0){days=10/1440;w.reps=0}else if(n===1){days=Math.max(1,Math.round(prev*1.2));w.reps=(w.reps||0)+1}else if(n===2){days=prev?Math.max(2,Math.round(prev*2.5)):1;w.reps=(w.reps||0)+1}else{days=prev?Math.max(4,Math.round(prev*3.5)):4;w.reps=(w.reps||0)+1}w.interval=days;w.due=now()+days*86400000;current=null;persist();renderStudy()}
$('add').onclick=()=>{if(add($('word').value,$('meaning').value,'manual',$('example').value)){$('word').value='';$('meaning').value='';$('example').value='';alert('登録しました。単語カードに追加されました。')}else alert('単語が空欄、または登録済みです')};$('fetch').onclick=async()=>{const b=$('fetch');b.disabled=true;b.textContent='取得中…';try{const r=await fetch('./data/latest.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('データが見つかりません');const data=await r.json();$('updated').textContent='最終更新：'+(data.updatedAt||'不明');const root=$('candidates');root.replaceChildren();const fresh=(Array.isArray(data.candidates)?data.candidates:[]).filter(x=>x.word&&!words.some(w=>w.word===String(x.word).toLowerCase()));if(!fresh.length)root.textContent='新しい候補はありません';for(const c of fresh){const div=document.createElement('article');const title=document.createElement('strong');title.textContent=c.word+' ';const desc=document.createElement('small');desc.textContent='掲載数 '+(c.count||0)+' / '+(Array.isArray(c.sources)?c.sources.join('・'):'');const btn=document.createElement('button');btn.textContent='カードに追加';btn.onclick=()=>{if(add(c.word,'',Array.isArray(c.sources)?c.sources.join(', '):'news'))div.remove()};div.append(title,desc,document.createElement('br'),btn);root.append(div)}}catch(e){alert('取得できません：'+e.message)}finally{b.disabled=false;b.textContent='最新候補を取得'}};
function renderList(){const root=$('saved');root.replaceChildren();const q=$('search').value.toLowerCase();for(const w of words.filter(w=>(w.word+' '+(w.meaning||'')).toLowerCase().includes(q))){const div=document.createElement('article');const title=document.createElement('strong');title.textContent=w.word;const meaning=document.createElement('input');meaning.value=w.meaning||'';meaning.placeholder='日本語の意味を入力';meaning.setAttribute('aria-label',w.word+'の意味');meaning.onchange=()=>{w.meaning=meaning.value;persist()};const example=document.createElement('input');example.value=w.example||'';example.placeholder='例文（任意）';example.setAttribute('aria-label',w.word+'の例文');example.onchange=()=>{w.example=example.value;persist()};const del=document.createElement('button');del.className='danger';del.textContent='削除';del.onclick=()=>{if(confirm(w.word+'を削除しますか？')){words=words.filter(x=>x!==w);if(current===w)current=null;persist();renderList()}};div.append(title,meaning,example,del);root.append(div)}if(!root.children.length)root.textContent='該当する単語はありません'}$('search').oninput=renderList;$('backup').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(words,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='ielts-words.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};$('restore').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());const arr=Array.isArray(data)?data:data.words;if(!Array.isArray(arr))throw Error('配列ではありません');let n=0;for(const w of arr){if(typeof w.word==='string'&&add(w.word,w.meaning||'',w.source||'import',w.example||'')){const dest=words.find(x=>x.word===w.word.trim().toLowerCase());if(dest&&Number.isFinite(w.due)&&Number.isFinite(w.interval)){dest.due=w.due;dest.interval=w.interval;dest.reps=Number(w.reps)||0}n++}}persist();renderList();alert(n+'語を取り込みました')}catch(err){alert('JSONを読み込めません：'+err.message)}e.target.value=''};renderStats();renderStudy();
</script></body></html>
